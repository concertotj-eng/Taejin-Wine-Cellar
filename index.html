<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Taejin's 와인 셀러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --wine-950:#1c0a10;
    --wine-900:#260f16;
    --wine-800:#3d1520;
    --wine-700:#5a1c2b;
    --gold:#c9a24b;
    --gold-soft:#e3c98a;
    --cream:#f3e9d8;
    --parchment:#f8f2e6;
    --parchment-dim:#efe6d4;
    --ink:#2a1810;
    --ink-dim:#6b5a4d;
    --red-dot:#7a2434;
    --white-dot:#e3d478;
    --rose-dot:#e08a9b;
    --sparkling-dot:#a9d6e0;
    --dessert-dot:#a8672f;
    --orange-dot:#d97a2f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 500px at 10% -10%, #34131c 0%, transparent 60%),
      radial-gradient(800px 400px at 100% 0%, #2a1018 0%, transparent 55%),
      var(--wine-950);
    color:var(--cream);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    min-height:100vh;
    padding-bottom:100px;
  }
  .hidden{display:none !important;}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}

  /* HEADER */
  .header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, var(--wine-950) 70%, rgba(28,10,16,0));
    padding:20px 16px 10px;
    backdrop-filter:blur(4px);
  }
  .header-inner{max-width:560px;margin:0 auto;}
  .hero-title{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    font-weight:700;font-size:32px;letter-spacing:0.3px;
    color:var(--cream);margin:0 0 2px;line-height:1.1;
  }
  .hero-title em{font-style:italic;color:var(--gold-soft);}
  .hero-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--gold);opacity:0.85;margin-bottom:14px;
  }

  /* TABS */
  .tabbar{
    display:flex;background:rgba(255,255,255,0.06);border-radius:12px;padding:4px;gap:4px;
    border:1px solid rgba(201,162,75,0.2);
  }
  .tab{
    flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:600;
    color:rgba(243,233,216,0.6);cursor:pointer;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    transition:background .15s ease, color .15s ease;
    display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;line-height:1.3;
  }
  .tab.active{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:var(--ink);}
  .tab .count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:0.75;}

  .search{
    width:100%;margin-top:10px;
    background:rgba(255,255,255,0.05);border:1px solid rgba(201,162,75,0.25);
    color:var(--cream);border-radius:10px;padding:11px 14px;font-size:14px;
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  }
  .search::placeholder{color:rgba(243,233,216,0.4);}

  .viewtoggle{display:flex;gap:6px;margin-top:10px;}
  .viewtoggle-btn{
    flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(201,162,75,0.25);
    color:rgba(243,233,216,0.65);border-radius:8px;padding:8px 6px;font-size:12.5px;font-weight:600;
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;cursor:pointer;
  }
  .viewtoggle-btn.active{background:rgba(201,162,75,0.18);color:var(--gold-soft);border-color:rgba(201,162,75,0.5);}

  .purchase-toolbar{display:flex;gap:8px;margin-top:10px;}
  .period-tab-btn{
    background:rgba(255,255,255,0.05);border:1px solid rgba(201,162,75,0.25);
    color:rgba(243,233,216,0.75);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;cursor:pointer;
  }
  .period-tab-btn.active{background:rgba(201,162,75,0.18);color:var(--gold-soft);border-color:rgba(201,162,75,0.5);}

  /* SUMMARY BAR */
  .list-summary{
    display:flex;flex-direction:column;gap:8px;
    background:rgba(201,162,75,0.1);border:1px solid rgba(201,162,75,0.3);border-radius:10px;
    padding:11px 16px;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold-soft);
  }
  .list-summary b{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:15px;color:var(--cream);font-weight:700;}
  .color-breakdown{display:flex;flex-wrap:wrap;gap:6px 10px;}
  .color-chip{
    display:flex;align-items:center;gap:5px;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    font-size:11.5px;color:rgba(243,233,216,0.85);background:rgba(0,0,0,0.15);border-radius:999px;padding:4px 10px;
    cursor:pointer;border:1px solid transparent;transition:background .15s ease, border-color .15s ease;
  }
  .color-chip:active{transform:scale(0.97);}
  .color-chip.active{background:rgba(201,162,75,0.28);border-color:rgba(201,162,75,0.6);color:var(--cream);font-weight:600;}
  .multi-loc-toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-dim);font-weight:600;cursor:pointer;}
  .multi-loc-toggle input{width:auto;margin:0;}
  .multi-loc-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .multi-loc-row select{flex:1.3;}
  .multi-loc-row input{flex:1;}
  .multi-loc-remove{
    flex-shrink:0;background:rgba(170,51,51,0.1);color:#a33;border:1px solid rgba(170,51,51,0.3);
    border-radius:6px;width:34px;height:34px;font-size:14px;cursor:pointer;
  }
  .multi-loc-total{
    margin-top:8px;font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--wine-700);
    text-align:right;font-weight:600;
  }
  .color-chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .rows{display:flex;flex-direction:column;gap:8px;padding:14px 0 20px;}
  .row-item{
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(160deg,var(--parchment) 0%, var(--parchment-dim) 100%);
    color:var(--ink);border-radius:8px;padding:10px 12px;cursor:pointer;
    border:1px solid rgba(0,0,0,0.06);box-shadow:0 3px 10px rgba(0,0,0,0.18);
  }
  .row-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .row-main{flex:1;min-width:0;}
  .row-title{
    font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row-sub{
    font-size:11.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
  }
  .row-meta{
    text-align:right;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--wine-700);
    line-height:1.4;min-width:56px;
  }
  .row-meta .sub{color:var(--ink-dim);font-size:10.5px;}
  .row-action{
    flex-shrink:0;background:var(--wine-700);color:var(--cream);border:none;border-radius:6px;
    width:30px;height:30px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }

  /* PURCHASE LOG */
  .purchase-row{
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(160deg,var(--parchment) 0%, var(--parchment-dim) 100%);
    color:var(--ink);border-radius:8px;padding:12px 14px;cursor:pointer;
    border:1px solid rgba(0,0,0,0.06);box-shadow:0 3px 10px rgba(0,0,0,0.18);
  }
  .purchase-date{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);
    background:rgba(90,28,43,0.08);border-radius:6px;padding:6px 8px;text-align:center;flex-shrink:0;min-width:52px;
  }
  .purchase-main{flex:1;min-width:0;}
  .purchase-name{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .purchase-sub{font-size:11.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .purchase-cost{
    text-align:right;flex-shrink:0;font-family:'IBM Plex Mono',monospace;
  }
  .purchase-total{font-size:14px;font-weight:700;color:var(--wine-700);}
  .purchase-qty{font-size:10.5px;color:var(--ink-dim);}

  .purchase-group{margin-bottom:14px;}
  .purchase-group summary{
    list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;background:rgba(201,162,75,0.12);border:1px solid rgba(201,162,75,0.3);
    border-radius:8px;color:var(--gold-soft);font-size:13px;font-weight:700;
  }
  .purchase-group summary::-webkit-details-marker{display:none;}
  .purchase-group summary .pg-label{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:var(--cream);}
  .purchase-group summary .pg-total{font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .purchase-group-body{display:flex;flex-direction:column;gap:8px;padding-top:8px;}

  /* LIST */
  .list{padding:14px 0 20px;display:flex;flex-direction:column;gap:12px;}
  .card{
    background:linear-gradient(160deg,var(--parchment) 0%, var(--parchment-dim) 100%);
    color:var(--ink);border-radius:10px;padding:16px 16px 14px;
    position:relative;cursor:pointer;
    border:1px solid rgba(0,0,0,0.06);
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
    display:flex;flex-direction:column;height:100%;
  }
  .card-body{flex:1;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-dot{
    width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0;
  }
  .card-tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-dim);display:flex;align-items:center;}
  .qty-badge{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--wine-700);
    background:rgba(90,28,43,0.08);border-radius:999px;padding:4px 10px;white-space:nowrap;
  }
  .card-vintage{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-weight:700;font-size:15px;line-height:1.15;color:var(--wine-700);
  }
  .card-vintage.long{font-size:12px;font-weight:600;letter-spacing:0.2px;}
  .paren-sm{font-size:0.78em;opacity:0.8;}
  .card-name{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    font-weight:600;font-size:19px;line-height:1.25;margin:6px 0 2px;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:calc(19px * 1.25 * 2);
  }
  .card-winery{
    font-size:15.5px;font-weight:500;line-height:1.3;color:var(--ink-dim);margin-bottom:8px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
    min-height:calc(15.5px * 1.3);
  }
  .card-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);display:flex;justify-content:space-between;border-top:1px dashed rgba(0,0,0,0.15);padding-top:8px;margin-top:4px;flex-wrap:wrap;gap:4px;}
  .card-price{color:var(--wine-700);font-weight:600;}
  .card-extra{display:flex;gap:10px;margin-top:6px;font-size:11.5px;color:var(--ink-dim);flex-wrap:wrap;}
  .card-extra span b{color:var(--ink);}
  .card-actions{margin-top:10px;display:flex;gap:8px;}
  .mini-btn{
    flex:1;text-align:center;background:var(--wine-700);color:var(--cream);border:none;border-radius:8px;
    padding:9px 8px;font-size:12.5px;font-weight:600;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;cursor:pointer;
  }
  .mini-btn.secondary{background:transparent;color:var(--wine-700);border:1px solid var(--wine-700);}
  .mini-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .taste-count{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);opacity:0.9;
    background:rgba(90,28,43,0.9);color:var(--gold-soft);border-radius:999px;padding:2px 8px;display:inline-block;margin-top:6px;
  }
  .card-memo{
    font-size:11.5px;color:var(--ink-dim);margin-top:8px;font-style:italic;
    background:rgba(90,28,43,0.06);border-radius:6px;padding:6px 8px;line-height:1.4;
  }
  .drink-badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
    border-radius:999px;padding:3px 9px;margin-top:6px;white-space:nowrap;
  }
  .drink-waiting{background:rgba(90,120,180,0.15);color:#3d5a8a;}
  .drink-ready{background:rgba(90,180,90,0.18);color:#2d6b2d;}
  .drink-past{background:rgba(200,90,60,0.15);color:#a84a2a;}
  .drink-unknown{background:rgba(0,0,0,0.08);color:var(--ink-dim);}

  .empty{
    text-align:center;padding:60px 20px;border:1px dashed rgba(201,162,75,0.35);border-radius:12px;margin-top:14px;
  }
  .empty h3{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:22px;color:var(--gold-soft);margin-bottom:6px;}
  .empty p{color:rgba(243,233,216,0.6);font-size:13.5px;line-height:1.5;}

  /* FAB */
  .fab{
    position:fixed;right:20px;bottom:24px;z-index:30;
    width:58px;height:58px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#e3c98a,#b8862f 70%);
    color:#2a1810;border:none;font-size:28px;font-weight:600;cursor:pointer;
    box-shadow:0 8px 22px rgba(0,0,0,0.45);
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }

  /* BOTTOM SHEET */
  .overlay{
    position:fixed;inset:0;background:rgba(10,4,6,0.6);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--parchment);color:var(--ink);width:100%;max-width:560px;
    border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;
    box-shadow:0 -10px 40px rgba(0,0,0,0.5);
    animation:slideup .22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0.5;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:40px;height:4px;background:rgba(0,0,0,0.15);border-radius:99px;margin:10px auto 4px;}
  .sheet-head{
    padding:6px 20px 14px;display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid rgba(90,28,43,0.15);
  }
  .sheet-head h2{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:22px;margin:0;font-weight:600;color:var(--wine-700);}
  .close-btn{background:rgba(0,0,0,0.06);border:none;color:var(--ink);font-size:18px;cursor:pointer;line-height:1;width:30px;height:30px;border-radius:50%;}
  .sheet-body{padding:16px 20px 6px;overflow-y:auto;}

  .banner{
    background:rgba(90,28,43,0.08);border:1px solid rgba(90,28,43,0.2);border-radius:10px;
    padding:12px 14px;font-size:13px;color:var(--wine-700);margin-bottom:16px;line-height:1.5;
  }
  .banner b{color:var(--ink);}
  .wine-context{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:20px;font-weight:600;color:var(--wine-700);
    margin-bottom:2px;
  }
  .wine-context-sub{font-size:12px;color:var(--ink-dim);margin-bottom:14px;}

  fieldset{border:none;padding:0;margin:0 0 20px;}
  legend{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--wine-700);margin-bottom:9px;padding:0;border-bottom:1px solid rgba(90,28,43,0.25);
    width:100%;padding-bottom:6px;
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:9px;}
  .field-row.single{grid-template-columns:1fr;}
  label{display:block;font-size:11px;color:var(--ink-dim);margin-bottom:4px;font-weight:600;}
  input[type=text], input[type=number], input[type=date], textarea, select{
    width:100%;padding:10px 10px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:15px;background:#fff;color:var(--ink);
  }
  input::placeholder, textarea::placeholder{
    font-style:italic;color:rgba(90,28,43,0.35);font-weight:400;
  }
  textarea{resize:vertical;min-height:42px;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;}
  .color-select{display:flex;gap:7px;flex-wrap:wrap;}
  .color-opt{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 9px;border:1px solid rgba(0,0,0,0.15);border-radius:999px;cursor:pointer;}
  .color-opt input{width:auto;margin:0;}
  .swatch{width:11px;height:11px;border-radius:50%;display:inline-block;}

  .sheet-actions{
    display:flex;justify-content:space-between;padding:14px 20px 20px;gap:10px;
    border-top:1px solid rgba(90,28,43,0.1);background:var(--parchment);
  }
  .btn{padding:13px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;}
  .btn-save{background:var(--wine-700);color:var(--cream);flex:1;}
  .btn-delete{background:transparent;color:#a33;border:1px solid rgba(170,51,51,0.4);}

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--wine-800);color:var(--gold-soft);padding:10px 18px;border-radius:8px;
    font-size:13px;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;box-shadow:0 6px 20px rgba(0,0,0,0.4);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:100;
    max-width:80%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  /* CHOICE SHEET */
  .choice-overlay{
    position:fixed;inset:0;background:rgba(10,4,6,0.6);display:none;
    align-items:flex-end;justify-content:center;z-index:60;
  }
  .choice-overlay.open{display:flex;}
  .choice-sheet{
    background:var(--parchment);width:100%;max-width:560px;border-radius:18px 18px 0 0;
    padding:10px 20px 26px;animation:slideup .22s ease-out;
  }
  .choice-item{
    display:flex;align-items:center;gap:12px;padding:16px 6px;border-bottom:1px solid rgba(0,0,0,0.08);
    cursor:pointer;color:var(--ink);
  }
  .choice-item:last-child{border-bottom:none;}
  .choice-icon{font-size:22px;}
  .choice-text b{display:block;font-size:14.5px;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;}
  .choice-text span{font-size:12px;color:var(--ink-dim);}

  /* VIEW (읽기 전용) SHEET */
  .view-head{
    padding:16px 20px 14px;display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:1px solid rgba(90,28,43,0.15);
  }
  .view-title{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:20px;font-weight:700;color:var(--wine-700);margin:0 0 2px;}
  .view-subtitle{font-size:14.5px;font-weight:500;color:var(--ink-dim);}
  .view-head-actions{display:flex;gap:6px;flex-shrink:0;}

<!-- ===== Firebase 연동 설정 =====
     아래 firebaseConfig 값을 본인의 Firebase 프로젝트 설정값으로 교체하세요.
     Firebase 콘솔(console.firebase.google.com) > 프로젝트 설정 > 일반 > "내 앱"에서 확인 가능합니다. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, deleteDoc,
    collection, query, orderBy, startAt, endAt, getDocs
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyArGZXTBQDPvY2HznuVob-NT6MkYav2lD8",
    authDomain: "taejin-wine.firebaseapp.com",
    projectId: "taejin-wine",
    storageBucket: "taejin-wine.firebasestorage.app",
    messagingSenderId: "682098549154",
    appId: "1:682098549154:web:7f759093d1d974ba92d2fb"
  };

  try{
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.__fb = {
      async get(key){
        const snap = await getDoc(doc(db, 'kv', key));
        if(!snap.exists()) throw new Error('not found: ' + key);
        return { key, value: snap.data().value };
      },
      async set(key, value){
        await setDoc(doc(db, 'kv', key), { value });
        return { key, value };
      },

/* ---------- 저장소 안전 래퍼 (Firebase 우선 → 없으면 Claude 저장소 → 최종적으로 메모리) ---------- */
const memStore = new Map();
const hasClaudeStorage = (typeof window.storage !== 'undefined');

function withTimeout(promise, ms){
  return new Promise((resolve, reject)=>{
    const timer = setTimeout(()=>reject(new Error('storage timeout after '+ms+'ms')), ms);
    promise.then(v=>{ clearTimeout(timer); resolve(v); }, e=>{ clearTimeout(timer); reject(e); });
  });
}
const STORAGE_TIMEOUT = 3500; // 이 시간 안에 응답 없으면 포기하고 다음 경로로 넘어감

async function sSet(key, value, shared){
  memStore.set(key, value); // 항상 메모리에도 기록해 이번 세션에서는 확실히 반영되도록 함
  if(window.__fb){
    try{ await withTimeout(window.__fb.set(key, value), STORAGE_TIMEOUT); return { key, value, shared: !!shared }; }
    catch(e){ console.warn('firebase set 실패/타임아웃', key, e); }
  }
  if(hasClaudeStorage){
    try{ const r = await withTimeout(window.storage.set(key, value, shared), STORAGE_TIMEOUT); if(r) return r; }
    catch(e){ console.warn('storage set 실패/타임아웃 - 메모리로 대체', key, e); }
  }
  return { key, value, shared: !!shared };
}

async function sGet(key, shared){
  if(memStore.has(key)) return { key, value: memStore.get(key), shared: !!shared };
  if(window.__fb){
    try{
      const r = await withTimeout(window.__fb.get(key), STORAGE_TIMEOUT);
      if(r && r.value !== undefined) memStore.set(key, r.value);
      return r;
    }catch(e){ if(!hasClaudeStorage) throw e; /* Firebase에 없으면 Claude 저장소도 확인 */ }
  }
  if(hasClaudeStorage){
    const r = await withTimeout(window.storage.get(key, shared), STORAGE_TIMEOUT); // 없으면 예외 발생(정상 동작), 호출부에서 처리
    if(r && r.value !== undefined) memStore.set(key, r.value);
    return r;
  }
  throw new Error('not found: ' + key);
}

async function sDelete(key, shared){
  memStore.delete(key);
  if(window.__fb){
    try{ await withTimeout(window.__fb.delete(key), STORAGE_TIMEOUT); }catch(e){ console.warn('firebase delete 실패/타임아웃', key, e); }
  }
  if(hasClaudeStorage){
    try{ const r = await withTimeout(window.storage.delete(key, shared), STORAGE_TIMEOUT); if(r) return r; }
    catch(e){ console.warn('storage delete 실패/타임아웃 - 메모리로 대체', key, e); }
  }
  return { key, deleted:true, shared: !!shared };
}

async function sList(prefix, shared){
  let realKeys = [];
  if(window.__fb){
    try{
      const r = await withTimeout(window.__fb.list(prefix), STORAGE_TIMEOUT);
      realKeys = (r && r.keys) ? r.keys : [];
    }catch(e){ console.warn('firebase list 실패/타임아웃', prefix, e); }
  }
  if(hasClaudeStorage){
    try{
      const r = await withTimeout(window.storage.list(prefix, shared), STORAGE_TIMEOUT);
      const claudeKeys = (r && r.keys) ? r.keys : [];
      realKeys = Array.from(new Set([...realKeys, ...claudeKeys]));
    }catch(e){ console.warn('storage list 실패/타임아웃 - 메모리 인덱스로 대체', prefix, e); }
  }
  const memKeys = Array.from(memStore.keys()).filter(k=>k.startsWith(prefix));
  const merged = Array.from(new Set([...realKeys, ...memKeys]));
  return { keys: merged, prefix, shared: !!shared };
}

/* ---------- 자체 인덱스 관리 (일부 모바일 환경에서 storage.list()가 실패하는 문제 대응) ---------- */
async function getIndex(prefix){
  try{
    const r = await sGet('idx:'+prefix, false);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){ /* 인덱스 아직 없음 */ }
  return [];
}
async function addToIndex(prefix, id){
  try{
    const idx = await getIndex(prefix);
    if(!idx.includes(id)){
      idx.push(id);
      await sSet('idx:'+prefix, JSON.stringify(idx), false);
    }
  }catch(e){ console.error('addToIndex failed', e); }
}
async function removeFromIndex(prefix, id){
  try{
    const idx = await getIndex(prefix);
    const filtered = idx.filter(x=>x!==id);
    await sSet('idx:'+prefix, JSON.stringify(filtered), false);
  }catch(e){ console.error('removeFromIndex failed', e); }
}
async function listKeysRobust(prefix){
  // storage.list()가 되는 환경에서는 그 결과와 자체 인덱스를 합쳐서 반환,
  // list()가 실패하는 환경(일부 모바일)에서는 자체 인덱스만으로 동작
  let listedIds = [];
  try{
    const listRes = await sList(prefix+':', false);
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    listedIds = keys.map(k => k.startsWith(prefix+':') ? k.slice(prefix.length+1) : k);
  }catch(e){ /* list 미지원 환경 - 인덱스로 대체 */ }
  const indexedIds = await getIndex(prefix);
  return Array.from(new Set([...listedIds, ...indexedIds]));
}

async function seedIfMissing(seed){
  const markerKey = 'seedmark:'+seed.id;
  try{
    await sGet(markerKey, false);
    return null; // 이미 예전에 시딩된 적 있음(삭제했더라도 다시 넣지 않음)
  }catch(e){
    const data = Object.assign({ createdAt: Date.now() }, seed);
    try{
      await sSet('wine:'+data.id, JSON.stringify(data), false);
      await sSet(markerKey, '1', false);
      await addToIndex('wine', data.id);
      return data;
    }catch(err){ console.error('seed save error', err); return null; }
  }
}

async function loadWines(){
  document.getElementById('loadingMsg').style.display='block';
  try{
    const vm = await sGet('ui:viewmode', false);
    if(vm && vm.value && (vm.value==='card' || vm.value==='list')){
      viewMode = vm.value;
      document.getElementById('viewCardBtn').classList.toggle('active', viewMode==='card');
      document.getElementById('viewListBtn').classList.toggle('active', viewMode==='list');
    }
  }catch(e){ /* no saved preference yet */ }
  try{
    const ids = await listKeysRobust('wine');
    const loaded = [];
    for(const id of ids){
      try{
        const r = await sGet('wine:'+id, false);
        if(r && r.value){
          const w = JSON.parse(r.value);
          if(!Array.isArray(w.tastings)) w.tastings = [];
          if(w.quantity===undefined || w.quantity===null || w.quantity==='') w.quantity = 0;
          if(!w.location){ w.location = (w.winetype==='cellar' && w.tier) ? String(w.tier) : '외부'; }
          loaded.push(w);
        }
      }catch(e){ /* skip */ }
    }
    for(const seed of seedWines){
      if(loaded.some(w=>w.id===seed.id)) continue; // 이미 목록에 있으면 중복 시딩 시도 안 함
      const added = await seedIfMissing(seed);
      if(added) loaded.push(added);
    }
    loaded.sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
    wines = loaded;
  }catch(e){
    console.error('load error', e);
  }
  document.getElementById('loadingMsg').style.display='none';
  render();
}

function escapeHtml(s){
  if(s===undefined||s===null) return '';
  s = String(s);
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function truncate(s,n){ s=s||''; return s.length>n ? s.slice(0,n)+'…' : s; }
function qty(w){ return parseInt(w.quantity)||0; }
function vintageClass(v){ return (v && String(v).length>4) ? 'long' : ''; }
function locationLabel(loc){
  if(!loc || loc==='외부') return '외부';
  if(loc==='multi') return '여러 위치';
  return `셀러 ${loc}단`;
}
function getWineLocations(w){
  // locations 배열이 있으면 그걸 정본으로 사용, 없으면 기존 단일 location/quantity로 구성
  if(Array.isArray(w.locations) && w.locations.length>0){
    return w.locations.filter(r=>r && (parseInt(r.qty)||0) > 0);
  }
  return [{ loc: w.location||'외부', qty: qty(w) }];
}
function locationBreakdownText(w){
  const locs = getWineLocations(w);
  if(locs.length<=1) return '';
  return locs.map(r=>`${locationLabel(r.loc)} ${r.qty}병`).join(' · ');
}

function drinkWindowInfo(w){
  const from = parseInt(w.drinkfrom), to = parseInt(w.drinkto);
  if(!from && !to) return null;
  const nowYear = new Date().getFullYear();
  const rangeText = from && to ? `${from}~${to}` : (from ? `${from}년부터` : `~${to}년까지`);
  let status = 'unknown', label = rangeText;
  if(from && nowYear < from){
    status = 'waiting'; label = `${rangeText} · 대기중 (${from-nowYear}년 후 시작)`;
  } else if(to && nowYear > to){
    status = 'past'; label = `${rangeText} · 적기 지남`;
  } else if((from && nowYear >= from) && (!to || nowYear <= to)){
    status = 'ready'; label = `${rangeText} · 지금 적기예요`;
  }
  return { from, to, status, label, rangeText };
}
function drinkWindowBadgeHtml(w){
  const info = drinkWindowInfo(w);
  if(!info) return '';
  return `<span class="drink-badge drink-${info.status}">🗓 ${escapeHtml(info.label)}</span>`;
}
function shrinkParens(s){
  const escaped = escapeHtml(s);
  return escaped.replace(/\(([^()]*)\)/g, '<span class="paren-sm">($1)</span>');
}

function formatDateInput(el){
  const digits = el.value.replace(/[^0-9]/g,'').slice(0,8);
  let formatted = digits;
  if(digits.length>4) formatted = digits.slice(0,4)+'-'+digits.slice(4);
  if(digits.length>6) formatted = digits.slice(0,4)+'-'+digits.slice(4,6)+'-'+digits.slice(6);
  el.value = formatted;
}
function formatPrice(el){
  const hasWon = /원/.test(el.value);
  const digits = el.value.replace(/[^0-9]/g,'');
  if(!digits){ el.value = ''; return; }
  const formatted = digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  el.value = formatted + (hasWon ? '원' : '');
}
function formatPriceRaw(v){
  if(!v) return '';
  const hasWon = /원/.test(v);
  const digits = String(v).replace(/[^0-9]/g,'');
  if(!digits) return v;
  const formatted = digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return formatted + (hasWon ? '원' : '');
}

/* ---------- 구매 내역 ---------- */
let purchases = [];
let editingPurchaseId = null;

function parsePriceNumber(v){
  if(!v) return 0;
  const digits = String(v).replace(/[^0-9]/g,'');
  return digits ? parseInt(digits) : 0;
}

async function loadPurchases(){
  try{
    const ids = await listKeysRobust('purchase');
    const loaded = [];
    for(const id of ids){
      try{
        const r = await sGet('purchase:'+id, false);
        if(r && r.value) loaded.push(JSON.parse(r.value));
      }catch(e){ /* skip */ }
    }
    loaded.sort((a,b)=>{
      const da = a.date||'', db = b.date||'';
      if(da!==db) return db.localeCompare(da);
      return (b.createdAt||0)-(a.createdAt||0);
    });
    purchases = loaded;
  }catch(e){ console.error('load purchases error', e); }
}

async function persistPurchase(p){
  const result = await sSet('purchase:'+p.id, JSON.stringify(p), false);
  if(!result) throw new Error('save failed');
  await addToIndex('purchase', p.id);
  const idx = purchases.findIndex(x=>x.id===p.id);
  if(idx>=0) purchases[idx]=p; else purchases.unshift(p);
  purchases.sort((a,b)=>{
    const da = a.date||'', db = b.date||'';
    if(da!==db) return db.localeCompare(da);
    return (b.createdAt||0)-(a.createdAt||0);
  });
}

function updatePurchaseTotal(){

function closePurchasePanel(){
  document.getElementById('purchaseOverlay').classList.remove('open');

async function savePurchase(){
  const data = {
    id: editingPurchaseId || ('p' + Date.now()),
    date: document.getElementById('p_date').value,
    store: document.getElementById('p_store').value,
    name: document.getElementById('p_name').value,
    quantity: document.getElementById('p_quantity').value,
    unitprice: document.getElementById('p_unitprice').value,
    note: document.getElementById('p_note').value,
    createdAt: editingPurchaseId ? ((purchases.find(x=>x.id===editingPurchaseId)||{}).createdAt || Date.now()) : Date.now()
  };

    closePurchasePanel();

  }catch(e){
    console.error('save purchase error', e);
    showToast('저장 중 오류가 발생했어요.');

}

function handlePurchaseDelete(){
  if(!editingPurchaseId) return;
  showConfirm('이 구매 내역을 삭제할까요?', async ()=>{

function render(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const matches = (w)=>{
    if(!q) return true;
    return [
      w.name, w.winery, w.grape, w.country, w.region,
      w.vintage, w.grade, (locationBreakdownText(w) || locationLabel(w.location)),
      w.purchaseplace, w.winerynotes, w.grapenotes, w.vintagenotes, w.refs, w.tastingmemo
    ].filter(Boolean).join(' ').toLowerCase().includes(q);
  };

  const list = document.getElementById('list');
  const rows = document.getElementById('rows');
  const purchaseRows = document.getElementById('purchaseRows');
  const empty = document.getElementById('emptyState');
  const summary = document.getElementById('listSummary');

    list.classList.add('hidden');
    rows.classList.add('hidden');
    document.getElementById('cellarRackContainer').classList.add('hidden');

      if(!q) return true;
      return [p.name,p.store].filter(Boolean).join(' ').toLowerCase().includes(q);
    };

    if(filteredP.length>0){
      const totalSpent = filteredP.reduce((sum,p)=> sum + (parseInt(p.quantity)||0)*parsePriceNumber(p.unitprice), 0);
      summary.innerHTML = `<div style="display:flex;justify-content:space-between;width:100%;"><span>${periodLabel()} · ${filteredP.length}건</span><span>총 <b>${totalSpent.toLocaleString('ko-KR')}원</b></span></div>`;
      summary.classList.remove('hidden');
    } else {
      summary.classList.add('hidden');
    }

    if(filteredP.length===0){
      purchaseRows.innerHTML = ''; purchaseRows.classList.add('hidden');
      empty.style.display='block';
      empty.querySelector('h3').textContent = purchases.length===0 ? '구매 내역이 없어요' : '해당 기간에 구매 내역이 없어요';

    }
    empty.style.display='none';
    purchaseRows.classList.remove('hidden');

    const rowHtml = (p) => {
      const total = (parseInt(p.quantity)||0) * parsePriceNumber(p.unitprice);
      return `
      <div class="purchase-row" onclick="openPurchaseForm('${p.id}')">
        <div class="purchase-date">${escapeHtml(p.date)||'-'}</div>
        <div class="purchase-main">
          <div class="purchase-name">${escapeHtml(p.name)||'(이름 없음)'}</div>

        </div>

          <div class="purchase-total">${total.toLocaleString('ko-KR')}원</div>

        </div>
      </div>`;
    };

    const activeGroupMode = autoGroupMode(filteredP);
    if(activeGroupMode==='all'){
      purchaseRows.innerHTML = filteredP.map(rowHtml).join('');
    } else {
      const groups = new Map(); // insertion order = most recent first (filteredP already sorted desc)

        groups.get(key).push(p);
      });

        const subtotal = items.reduce((sum,p)=> sum + (parseInt(p.quantity)||0)*parsePriceNumber(p.unitprice), 0);

        return `

        byColor[c].bottles += qty(w);

        </div>
        <div class="color-breakdown">${chips}</div>
      `;
      summary.classList.remove('hidden');
    } else {
      summary.classList.add('hidden');
    }

    if(cellarAll.length===0){
      cellarRackContainer.innerHTML='';
      empty.style.display='block';
      empty.querySelector('h3').textContent = '보유 중인 와인이 없어요';
      empty.querySelector('p').textContent = '+ 버튼으로 와인을 추가하고 보관 위치를 지정해보세요.';
      return;
    }
    empty.style.display='none';

    const locRowHtml = (w, qtyOverride, locKey) => `
      <div class="row-item" onclick="openWineView('${w.id}')">
        <span class="row-dot" style="background:${colorMap[w.color]||colorMap.red}"></span>
        <div class="row-main">
          <div class="row-title">${escapeHtml(w.name)||'(이름 없음)'} · ${escapeHtml(w.vintage)||'—'}${w.tastingmemo?' 📝':''}</div>
          <div class="row-sub">${shrinkParens(w.winery)||''}${(function(){ const di=drinkWindowInfo(w); return di ? ' · 🗓 '+escapeHtml(di.rangeText) : ''; })()}</div>
        </div>
        <div class="row-meta">
          <div>🍾 ${qtyOverride!==undefined ? qtyOverride : qty(w)}병${qtyOverride!==undefined && qtyOverride!==qty(w) ? ` <span style="opacity:0.6;">/${qty(w)}</span>` : ''}</div>
        </div>
        <button class="row-action" onclick="event.stopPropagation();openTasteLog('${w.id}', '${locKey||''}')" title="시음 기록하기">🍷</button>
      </div>`;

    const locKeys = ['외부','1','2','3','4','5','6','7','8','9'];
    // 와인마다 여러 위치에 나뉘어 있을 수 있으므로, 각 위치 버킷에 해당 병수만큼만 배분
    const bucket = {};
    locKeys.forEach(k=> bucket[k] = []);
    filteredRack.forEach(w=>{
      getWineLocations(w).forEach(entry=>{
        const key = locKeys.includes(entry.loc) ? entry.loc : '외부';
        bucket[key].push({ wine: w, qtyHere: entry.qty });
      });
    });
    let firstOpen = false;
    const locHtml = [];
    for(const loc of locKeys){
      const items = bucket[loc];
      if(items.length===0 && (q || loc!=='외부')) continue; // 검색 중이거나 빈 셀러 단은 숨기되, '외부'는 기본으로 항상 노출
      const locBottles = items.reduce((sum,it)=>sum+it.qtyHere, 0);
      const openAttr = (!firstOpen && items.length>0) ? (firstOpen=true, ' open') : '';
      locHtml.push(`
        <details class="purchase-group"${openAttr}>
          <summary><span class="pg-label">${locationLabel(loc)}</span><span class="pg-total">${items.length}종 · ${locBottles}병</span></summary>
          <div class="purchase-group-body">${items.length ? items.map(it=>locRowHtml(it.wine, it.qtyHere, loc)).join('') : '<div class="view-empty">비어있어요</div>'}</div>
        </details>`);
    }
    cellarRackContainer.innerHTML = locHtml.join('');
    return;
  }
  cellarRackContainer.classList.add('hidden');
  list.classList.toggle('hidden', viewMode!=='card');
  rows.classList.toggle('hidden', viewMode!=='list');
  purchaseRows.classList.add('hidden');

  const searchFiltered = currentTab==='cellar' ? cellarAll.filter(matches) : tastedEntries.filter(e=>matches(e.wine));
  const filtered = colorFilter
    ? searchFiltered.filter(x => (currentTab==='cellar' ? x.color : x.wine.color) === colorFilter)
    : searchFiltered;

  if(viewMode==='list' && currentTab==='cellar' && searchFiltered.length>0){
    const totalBottles = filtered.reduce((sum,w)=>sum+qty(w), 0);
    const byColor = {};
    searchFiltered.forEach(w=>{
      const c = w.color || 'red';
      if(!byColor[c]) byColor[c] = { species:0, bottles:0 };
      byColor[c].species++;
      byColor[c].bottles += qty(w);
    });
    const colorOrder = ['red','white','rose','sparkling','orange','dessert'];
    const chips = colorOrder.filter(c=>byColor[c]).map(c=>`
      <span class="color-chip${colorFilter===c?' active':''}" onclick="toggleColorFilter('${c}')"><i class="color-chip-dot" style="background:${colorMap[c]}"></i>${colorLabel[c]} ${byColor[c].bottles}</span>
    `).join('');
    summary.innerHTML = `
      <div style="display:flex;justify-content:space-between;width:100%;">
        <span>${filtered.length}종 보유중</span><span>총 <b>${totalBottles}병</b></span>
      </div>
      <div class="color-breakdown">${chips}</div>
    `;
    summary.classList.remove('hidden');
  } else if(viewMode==='list' && currentTab==='tasted' && searchFiltered.length>0){
    const byColor = {};
    searchFiltered.forEach(e=>{
      const c = e.wine.color || 'red';
      byColor[c] = (byColor[c]||0) + 1;
    });
    const colorOrder = ['red','white','rose','sparkling','orange','dessert'];
    const chips = colorOrder.filter(c=>byColor[c]).map(c=>`
      <span class="color-chip${colorFilter===c?' active':''}" onclick="toggleColorFilter('${c}')"><i class="color-chip-dot" style="background:${colorMap[c]}"></i>${colorLabel[c]} ${byColor[c]}</span>
    `).join('');
    summary.innerHTML = `
      <div style="display:flex;justify-content:space-between;width:100%;">
        <span>시음 기록 ${filtered.length}건</span>
      </div>
      <div class="color-breakdown">${chips}</div>
    `;
    summary.classList.remove('hidden');
  } else {
    summary.classList.add('hidden');
  }

  if(filtered.length===0){
    list.innerHTML=''; rows.innerHTML='';
    empty.style.display='block';
    if(currentTab==='cellar'){
      empty.querySelector('h3').textContent = cellarAll.length===0 ? '보유 중인 와인이 없어요' : '검색 결과가 없어요';
      empty.querySelector('p').textContent = cellarAll.length===0 ? '가지고 있는 와인을 추가해서 채워보세요.' : '다른 검색어로 찾아보세요.';
    } else {
      empty.querySelector('h3').textContent = tastedEntries.length===0 ? '아직 시음 기록이 없어요' : '검색 결과가 없어요';
      empty.querySelector('p').textContent = tastedEntries.length===0 ? '보유 와인 탭에서 "시음 기록하기"를 눌러 기록을 남기거나, +버튼으로 바로 시음 기록을 추가해보세요.' : '다른 검색어로 찾아보세요.';
    }
    return;
  }
  empty.style.display='none';

  if(currentTab==='cellar'){
    if(viewMode==='card'){
      list.innerHTML = filtered.map(w=>`
        <div class="card">
          <div class="card-body" onclick="openWineView('${w.id}')">
            <div class="card-top">
              <div class="card-tag"><span class="card-dot" style="background:${colorMap[w.color]||colorMap.red}"></span>${colorLabel[w.color]||''}</div>
              <div class="qty-badge">🍾 ${qty(w)}병</div>
            </div>
            <div class="card-vintage ${vintageClass(w.vintage)}">${escapeHtml(w.vintage)||'—'}</div>
            <div class="card-name">${escapeHtml(w.name)||'(이름 없음)'}</div>
            <div class="card-winery">${shrinkParens(w.winery)||''}</div>
            <div class="card-meta">
              <span>${escapeHtml(w.grape)||''}</span>
              <span class="card-price">${escapeHtml(formatPriceRaw(w.price))}</span>
            </div>
            <div class="card-extra"><span>위치 <b>${locationBreakdownText(w) || locationLabel(w.location)}</b></span></div>
            ${drinkWindowBadgeHtml(w)}
            ${(w.tastings&&w.tastings.length>0) ? `<div class="taste-count">이 와인 시음 ${w.tastings.length}회</div>` : ''}
            ${w.tastingmemo ? `<div class="card-memo">📝 ${escapeHtml(truncate(w.tastingmemo,50))}</div>` : ''}
          </div>
          <div class="card-actions">
            <button class="mini-btn" onclick="event.stopPropagation();openTasteLog('${w.id}')">🍷 시음 기록하기</button>
          </div>
        </div>
      `).join('');
    } else {
      rows.innerHTML = filtered.map(w=>`
        <div class="row-item" onclick="openWineView('${w.id}')">
          <span class="row-dot" style="background:${colorMap[w.color]||colorMap.red}"></span>
          <div class="row-main">
            <div class="row-title">${escapeHtml(w.name)||'(이름 없음)'} · ${escapeHtml(w.vintage)||'—'}${w.tastingmemo?' 📝':''}</div>
            <div class="row-sub">${shrinkParens(w.winery)||''}${w.grape?' · '+shrinkParens(w.grape):''}${w.region?' · '+shrinkParens(w.region):''}</div>

            ${(function(){ const di=drinkWindowInfo(w); return di ? `<div class="sub" style="color:${di.status==='ready'?'#2d6b2d':di.status==='past'?'#a84a2a':'inherit'};">🗓 ${escapeHtml(di.rangeText)}</div>` : ''; })()}
          </div>
          <button class="row-action" onclick="event.stopPropagation();openTasteLog('${w.id}')" title="시음 기록하기">🍷</button>

    }

    if(viewMode==='card'){
      list.innerHTML = filtered.map(e=>{
        const w = e.wine, t = e.tasting;

/* ---------- 보기 방식 전환 ---------- */
function setViewMode(mode){
  viewMode = mode;
  document.getElementById('viewCardBtn').classList.toggle('active', mode==='card');
  document.getElementById('viewListBtn').classList.toggle('active', mode==='list');
  render();
  sSet('ui:viewmode', mode, false).catch(()=>{});
}

function autoGroupMode(entries){
  const years = new Set(), months = new Set();
  entries.forEach(p=>{
    if(p.date){ years.add(p.date.slice(0,4)); months.add(p.date.slice(0,7)); }
  });
  if(years.size > 1) return 'year';
  if(months.size > 1) return 'month';
  return 'all';
}

function periodLabel(){
  if(periodMode==='recent3') return '최근 3개월';
  if(periodMode==='thisMonth') return '이번 달';
  if(periodMode==='thisYear') return '올해';
  if(periodMode==='all') return '전체';
  if(periodMode==='custom'){
    const from = document.getElementById('periodFrom').value;
    const to = document.getElementById('periodTo').value;
    if(from || to) return `${from||'처음'} ~ ${to||'오늘'}`;
    return '기간 선택';
  }
  return '';
}

function setPeriodMode(mode){
  periodMode = mode;
  document.getElementById('periodRecent3Btn').classList.toggle('active', mode==='recent3');
  document.getElementById('periodMonthBtn').classList.toggle('active', mode==='thisMonth');
  document.getElementById('periodYearBtn').classList.toggle('active', mode==='thisYear');
  document.getElementById('periodAllBtn').classList.toggle('active', mode==='all');
  document.getElementById('periodCustomBtn').classList.toggle('active', mode==='custom');
  document.getElementById('customRangeBar').classList.toggle('hidden', mode!=='custom');
  render();
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function nMonthsAgoStr(n){
  const d = new Date();
  d.setMonth(d.getMonth()-n);
  return d.toISOString().slice(0,10);
}
function inPeriod(dateStr){
  if(periodMode==='all') return true;
  if(!dateStr) return false; // 날짜 미상 항목은 '전체'에서만 노출
  if(periodMode==='recent3') return dateStr >= nMonthsAgoStr(3);
  if(periodMode==='thisMonth') return dateStr.slice(0,7) === todayStr().slice(0,7);
  if(periodMode==='thisYear') return dateStr.slice(0,4) === todayStr().slice(0,4);
  if(periodMode==='custom'){
    const from = document.getElementById('periodFrom').value;
    const to = document.getElementById('periodTo').value;
    if(from && dateStr < from) return false;
    if(to && dateStr > to) return false;
    return true;
  }
  return true;
}

function purchaseGroupKey(dateStr, mode){
  if(!dateStr) return '날짜 미상';
  if(mode==='year') return dateStr.slice(0,4) + '년';
  if(mode==='month') return dateStr.slice(0,4) + '년 ' + parseInt(dateStr.slice(5,7),10) + '월';
  return '';
}

/* ---------- 읽기 전용 보기 ---------- */
function vItem(label, value){
  if(value===undefined||value===null||value==='') return '';
  return `<div class="view-item"><div class="view-label">${escapeHtml(label)}</div><div class="view-value">${shrinkParens(value)}</div></div>`;
}
function vSection(title, itemsArr){
  const filtered = itemsArr.filter(Boolean);
  if(filtered.length===0) return '';
  return `<div class="view-section"><div class="view-legend">${escapeHtml(title)}</div>${filtered.join('')}</div>`;
}

  document.getElementById('viewTitle').textContent = (w.vintage ? w.vintage+' · ' : '') + (w.name || '(이름 없음)');

  ]);

  const grape = vSection('포도 품종 노트', [vItem('노트', w.grapenotes)]);
  const vintage = vSection('빈티지 특징', [vItem('노트', w.vintagenotes)]);

      tastings.map(t => `
        <div class="view-taste-card" onclick="event.stopPropagation();openTasteView('${w.id}','${t.id}')">
          <div class="view-taste-top"><span>${escapeHtml(t.tastedate)||'날짜 미기록'}</span>${t.score?`<span class="view-taste-score">${escapeHtml(t.score)}/5</span>`:''}</div>
          ${t.review ? `<div class="view-taste-review">"${escapeHtml(truncate(t.review,60))}"</div>` : ''}

function openTasteView(wineId, tastingId){
  const w = wines.find(x=>x.id===wineId);
  if(!w) return;
  const t = (w.tastings||[]).find(x=>x.id===tastingId);
  if(!t) return;

  const overview = vSection('총평 & 페어링', [
    vItem('개인 점수', t.score ? t.score+'/5' : ''),
    vItem('재구매 의사', t.repurchase),
    vItem('한줄평 / 전체 인상', t.review),
    vItem('어울리는 음식/상황', t.pairing)
  ]);
  const look = vSection('외관', [ vItem('색상 / 농도', t.look), vItem('점도(다리)', t.legs) ]);
  const nose = vSection('향', [ vItem('1차 향', t.nose1), vItem('2차 향', t.nose2), vItem('3차 향', t.nose3) ]);
  const palate = vSection('맛', [
    vItem('산도', t.acidity), vItem('타닌', t.tannin), vItem('바디감', t.body),
    vItem('단맛/드라이함', t.sweetness), vItem('여운(피니시)', t.finish)
  ]);
  const context = vSection('와인 정보', [
    vItem('와이너리', w.winery), vItem('포도 품종', w.grape), vItem('잔여 수량', qty(w)+'병'), vItem('나의 시음 메모', w.tastingmemo)

  const body = overview + look + nose + palate + context;

function openWineForm(id){
  sheetMode = 'wine';
  editingWineId = id;
  editingTastingId = null;
  resetForm();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('tasteBanner').classList.add('hidden');
  document.getElementById('wineContextBox').classList.add('hidden');
  setSectionVisibility({basic:true, tasting:false});
  document.getElementById('deleteBtn').classList.toggle('hidden', !id);
  document.getElementById('deleteBtn').textContent = '이 와인 삭제';
  document.getElementById('panelTitle').textContent = id ? '와인 정보 수정' : '새 보유 와인 추가';

  const w = id ? wines.find(x=>x.id===id) : null;
  wineFields.forEach(f=>{
    const el = document.getElementById('f_'+f);
    if(el) el.value = w ? (w[f]||'') : (f==='quantity' && !id ? 1 : '');
  });
  const color = w ? (w.color||'red') : 'red';
  document.querySelectorAll('input[name=f_color]').forEach(r=>{ r.checked = (r.value===color); });
  const locEl = document.getElementById('f_location');

let isSaving = false;
async function saveForm(){
  if(isSaving) return; // 중복 클릭으로 인한 이중 저장/수량 오차 방지
  isSaving = true;
  const saveBtn = document.querySelector('#overlay .btn-save');
  if(saveBtn) saveBtn.disabled = true;
  try{
    if(sheetMode==='wine'){
      await saveWineInfo();
    } else if(sheetMode==='newTaste'){
      await saveNewTasteWine();
    } else if(sheetMode==='taste'){
      await saveTasteLog();
    } else if(sheetMode==='editTaste'){
      await saveEditTaste();
    }
  }catch(e){
    console.error('save error', e);
    showToast('저장 중 오류가 발생했어요.');
  }finally{
    isSaving = false;
    if(saveBtn) saveBtn.disabled = false;
  }
}

async function saveWineInfo(){
  const data = {};
  wineFields.forEach(f=>{
    const el = document.getElementById('f_'+f);
    data[f] = el ? el.value : '';
  });
  data.color = (document.querySelector('input[name=f_color]:checked')||{}).value || 'red';

  const isMulti = document.getElementById('f_multiloc_toggle').checked;
  if(isMulti){
    const cleanRows = multiLocRows
      .map(r=>({ loc: r.loc||'외부', qty: parseInt(r.qty)||0 }))
      .filter(r=>r.qty>0);
    if(cleanRows.length===0) cleanRows.push({ loc:'외부', qty:0 });
    data.locations = cleanRows;
    data.quantity = cleanRows.reduce((s,r)=>s+r.qty, 0);
    data.location = cleanRows.length>1 ? 'multi' : cleanRows[0].loc;
  } else {
    data.locations = null;
    if(!data.location) data.location = '외부';
  }

  data.id = editingWineId || ('w' + Date.now());
  const existing = editingWineId ? wines.find(x=>x.id===editingWineId) : null;
  data.tastings = existing ? (existing.tastings||[]) : [];
  data.createdAt = existing ? (existing.createdAt||Date.now()) : Date.now();

  await persistWine(data);
  await syncPurchaseFromWine(data);
  closePanel();
  switchTab('cellar');
  showToast('저장되었습니다 🍷');
}

async function saveNewTasteWine(){
  const data = {};
  wineFields.forEach(f=>{
    const el = document.getElementById('f_'+f);
    data[f] = el ? el.value : '';
  });

  data.color = (document.querySelector('input[name=f_color]:checked')||{}).value || 'red';

async function saveTasteLog(){
  const w = wines.find(x=>x.id===editingWineId);
  if(!w) return;
  const tasting = { id: 't'+Date.now(), createdAt: Date.now() };
  tastingFields.forEach(f=>{
    const el = document.getElementById('f_'+f);
    tasting[f] = el ? el.value : '';
  });
  const updated = Object.assign({}, w);
  updated.tastings = (w.tastings||[]).concat([tasting]);
  updated.quantity = Math.max(0, qty(w) - 1);

  // 여러 위치에 나눠 보관 중인 와인이면, 위치별 수량 배열도 총량과 어긋나지 않게 함께 줄임
  if(Array.isArray(w.locations) && w.locations.length>0){
    const newLocs = w.locations.map(r=>({ loc:r.loc, qty:parseInt(r.qty)||0 }));
    // 어떤 위치 카드에서 눌렀는지 알면 그 위치를 우선 차감, 모르면 수량이 남아있는 첫 위치를 차감
    let idx = tasteLogFromLocation ? newLocs.findIndex(r=>r.loc===tasteLogFromLocation && r.qty>0) : -1;
    if(idx<0) idx = newLocs.findIndex(r=>r.qty>0);
    if(idx>=0) newLocs[idx].qty -= 1;
    const filtered = newLocs.filter(r=>r.qty>0);
    if(filtered.length<=1){
      // 한 곳만 남으면 단일 위치로 단순화
      updated.locations = null;
      updated.location = filtered.length===1 ? filtered[0].loc : (w.location||'외부');
    } else {
      updated.locations = filtered;
      updated.location = 'multi';
    }
  }
  tasteLogFromLocation = null;

  await persistWine(updated);
  closePanel();
  // 보유 와인 탭에 그대로 머물러, 방금 줄어든 수량을 바로 확인할 수 있도록 함
  render();
  const msg = updated.quantity===0 ? '기록 완료 · 마지막 병을 다 드셨네요 🍷' : `기록 완료 · 잔여 ${updated.quantity}병`;
  showToast(msg);
}

async function saveEditTaste(){
  const w = wines.find(x=>x.id===editingWineId);
  if(!w) return;
  const idx = (w.tastings||[]).findIndex(t=>t.id===editingTastingId);
  if(idx<0) return;
  const updated = Object.assign({}, w);
  updated.tastings = w.tastings.slice();
  const tasting = Object.assign({}, updated.tastings[idx]);
  tastingFields.forEach(f=>{
    const el = document.getElementById('f_'+f);
    tasting[f] = el ? el.value : '';
  });
  updated.tastings[idx] = tasting;

  await persistWine(updated);
  closePanel();
  switchTab('tasted');
  showToast('시음 기록이 수정되었습니다');
}

async function deleteWine(){
  if(!editingWineId) return;
  showConfirm('이 와인과 관련된 모든 시음 기록도 함께 삭제됩니다. 삭제할까요?', async ()=>{
    try{
      await sDelete('wine:'+editingWineId, false);
      await removeFromIndex('wine', editingWineId);
      try{
        await sDelete('purchase:wine-'+editingWineId, false);
        await removeFromIndex('purchase', 'wine-'+editingWineId);
        purchases = purchases.filter(x=>x.id!==('wine-'+editingWineId));
      }catch(e){ /* 연동된 구매내역이 없으면 무시 */ }
      wines = wines.filter(x=>x.id!==editingWineId);
      closePanel();
      render();
      showToast('삭제되었습니다');
    }catch(e){
      console.error('delete error', e);
      showToast('삭제 중 오류가 발생했어요.');
    }
  });
}

async function deleteTasting(){
  const w = wines.find(x=>x.id===editingWineId);
  if(!w) return;
  showConfirm('이 시음 기록을 삭제할까요? 보유 수량이 1병 복원됩니다.', async ()=>{
    try{
      const updated = Object.assign({}, w);
      updated.tastings = (w.tastings||[]).filter(t=>t.id!==editingTastingId);
      updated.quantity = qty(w) + 1;

      if(Array.isArray(w.locations) && w.locations.length>0){
        const newLocs = w.locations.map(r=>({ loc:r.loc, qty:parseInt(r.qty)||0 }));
        newLocs[0].qty += 1; // 복원분은 첫 번째 위치에 되돌려 넣음 (정확한 원래 위치는 기록되지 않음)
        updated.locations = newLocs;
        updated.location = newLocs.length>1 ? 'multi' : newLocs[0].loc;
      }

      await persistWine(updated);
      closePanel();
      render();
      showToast('삭제되었습니다 · 잔여 ' + updated.quantity + '병');
    }catch(e){
      console.error('delete error', e);
      showToast('삭제 중 오류가 발생했어요.');
    }
  });
}

async function syncPurchaseFromWine(w){
  const linkedId = 'wine-'+w.id;
  const hasInfo = !!(w.price || w.purchasedate || w.purchaseplace);
  if(!hasInfo){
    try{
      await sDelete('purchase:'+linkedId, false);
      await removeFromIndex('purchase', linkedId);
      purchases = purchases.filter(x=>x.id!==linkedId);
    }catch(e){ /* 원래 없던 항목이면 무시 */ }
    return;
  }
  const totalQty = qty(w) + ((w.tastings&&w.tastings.length)||0);
  const data = {
    id: linkedId,
    date: w.purchasedate || '',
    store: w.purchaseplace || '',
    name: w.name || '',
    quantity: totalQty || 1,
    unitprice: w.price || '',
    note: '보유 와인 정보에서 자동 연동',
    createdAt: w.createdAt || Date.now()
  };
  try{ await persistPurchase(data); }catch(e){ console.error('sync purchase error', e); }
}

async function syncAllWinePurchases(){
  for(const w of wines){
    // 예전 방식(한 번만 반영)으로 만들어졌던 중복 항목 정리
    try{ await sDelete('purchase:migrate-'+w.id, false); }catch(e){ /* 없으면 무시 */ }
    purchases = purchases.filter(x=>x.id!==('migrate-'+w.id));
    await syncPurchaseFromWine(w);
  }
}

  try{ await loadWines(); }catch(e){ console.error('loadWines failed', e); }
  try{ await loadPurchases(); }catch(e){ console.error('loadPurchases failed', e); }

  // 무거운 1회성 정리 작업은 최초 1번만 실행되도록 마커로 게이트 (매번 실행되면 특히 모바일에서 느려지거나 멈출 수 있음)
  try{
    const marker = await sGet('migration:v2', false).catch(()=>null);
    if(!marker){
      try{ await syncAllWinePurchases(); }catch(e){ console.error('syncAllWinePurchases failed', e); }
      try{ await fixTier1Locations(); }catch(e){ console.error('fixTier1Locations failed', e); }
      try{ await sSet('migration:v2', '1', false); }catch(e){ /* ignore */ }
    }
  }catch(e){ console.error('migration gate failed', e); }
  try{ await fixQuantities(); }catch(e){ console.error('fixQuantities failed', e); }
  try{ await oneTimeCorrections(); }catch(e){ console.error('oneTimeCorrections failed', e); }
  try{ await oneTimeLocationFix_fontaineSaintMartin(); }catch(e){ console.error('oneTimeLocationFix failed', e); }
  try{ await fixDrinkWindows(); }catch(e){ console.error('fixDrinkWindows failed', e); }
  try{ await fixVintageCorrections(); }catch(e){ console.error('fixVintageCorrections failed', e); }

  document.getElementById('loadingMsg').style.display='none';
  render();
}
let __initCalled = false;
function __initOnce(){ if(__initCalled) return; __initCalled = true; init(); }
if(window.__fb){
  __initOnce();
} else {
  window.addEventListener('fbready', __initOnce, { once:true });
  setTimeout(__initOnce, 2000); // Firebase 설정이 없어도 앱은 뜨도록(메모리 모드)
}
// 최후의 안전장치: 무슨 일이 있어도 10초 안에는 화면이 뜨도록 강제
setTimeout(()=>{
  const lm = document.getElementById('loadingMsg');
  if(lm && lm.style.display !== 'none'){
    console.warn('워치독 타이머 발동 - 강제로 화면을 그립니다');
    lm.style.display = 'none';
    try{ render(); }catch(e){ console.error('watchdog render failed', e); }
  }
}, 10000);
</script>
